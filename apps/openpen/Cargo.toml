[package]
name = "openpen"
description = "OpenPen — editor de design (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
pen-schema.workspace = true
pen-doc.workspace = true
pen-layout.workspace = true
pen-render.workspace = true
pen-canvas.workspace = true
glam.workspace = true
cosmic-text.workspace = true
pen-mcp.workspace = true
pen-script.workspace = true
pen-shader.workspace = true
# Embedded chat (docs/chat.md).
pen-agent.workspace = true
# Web page import (docs/web-import.md).
pen-import.workspace = true
futures = "0.3"
# pen-import runs on its own Tokio runtime (web import).
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Home: recents store, thumbnails (pen-raster), dates.
pen-raster.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
# Recycle Bin (SHFileOperationW) and background thread priority for previews.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading"] }

[dev-dependencies]
# Chat tests: the API engine against a mock Messages API.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "openpen"
path = "src/main.rs"
