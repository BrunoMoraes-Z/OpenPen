[package]
name = "openpen-cli"
description = "OpenPen headless: validate/migrate/render/mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openpen-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
pen-schema.workspace = true
pen-doc.workspace = true
pen-layout.workspace = true
pen-render.workspace = true
pen-raster.workspace = true
pen-mcp.workspace = true
pen-export.workspace = true
pen-codegen.workspace = true
pen-script.workspace = true
pen-shader.workspace = true
pen-import.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-std", "sync"] }
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
