<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: #eef2f7; display: flex; justify-content: center; padding: 56px 0; }
  .panel { width: 480px; background: #fff; border-radius: 20px; padding: 36px; box-shadow: 0 20px 40px rgba(15,23,42,0.12), 0 2px 6px rgba(15,23,42,0.06); }
  h1 { font-size: 26px; line-height: 34px; margin: 0 0 6px; }
  .sub { color: #64748b; margin: 0 0 28px; font-size: 15px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; color: #334155; }
  .field { margin-bottom: 18px; }
  input[type=text], input[type=email], textarea { width: 100%; height: 44px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; font-size: 15px; color: #0f172a; background: #f8fafc; }
  textarea { height: 96px; padding: 10px 14px; resize: none; }
  input::placeholder, textarea::placeholder { color: #94a3b8; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #475569; margin-bottom: 24px; }
  button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #2563eb; color: #fff; font: inherit; font-weight: 600; font-size: 16px; box-shadow: 0 0 0 3px rgba(37,99,235,0.25); }
</style>
</head>
<body>
  <form class="panel" onsubmit="return false">
    <h1>Create your account</h1>
    <p class="sub">It takes less than a minute.</p>
    <div class="field"><label for="n">Full name</label><input id="n" type="text" value="Ada Lovelace"></div>
    <div class="field"><label for="e">Email</label><input id="e" type="email" placeholder="you@example.com"></div>
    <div class="field"><label for="m">Message</label><textarea id="m" placeholder="Tell us about your project"></textarea></div>
    <div class="row"><input type="checkbox" checked> <span>I agree to the terms</span></div>
    <button type="submit">Create account</button>
  </form>
</body>
</html>
