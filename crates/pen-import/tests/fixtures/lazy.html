<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery</title>
<link rel="stylesheet" href="common.css">
<style>
  .banner { height: 360px; background: url("/img/banner.png") center / cover no-repeat; display: flex; align-items: flex-end; padding: 32px 48px; }
  .banner h1 { margin: 0; color: #fff; font-size: 44px; line-height: 52px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .gallery { padding: 48px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; }
  .gallery figure { margin: 0; }
  .gallery img { width: 100%; height: 300px; object-fit: cover; border-radius: 12px; display: block; background: #e5e7eb; }
  figcaption { margin-top: 10px; color: #4b5563; font-size: 15px; }
  .spacer { height: 900px; background: linear-gradient(#ffffff, #e0f2fe); }
</style>
</head>
<body>
  <div class="banner"><h1>Summer gallery</h1></div>
  <div class="spacer"></div>
  <div class="gallery">
    <figure><img loading="lazy" src="/img/photo-4.png" alt="One"><figcaption>Native lazy loading</figcaption></figure>
    <figure><img loading="lazy" src="/img/photo-5.png" alt="Two"><figcaption>Native lazy loading</figcaption></figure>
    <figure><img class="js-lazy" data-src="/img/photo-6.png" alt="Three"><figcaption>IntersectionObserver</figcaption></figure>
    <figure><img class="js-lazy" data-src="/img/photo-7.png" alt="Four"><figcaption>IntersectionObserver</figcaption></figure>
  </div>
  <script>
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) { e.target.src = e.target.dataset.src; io.unobserve(e.target); }
      }
    });
    document.querySelectorAll('.js-lazy').forEach((img) => io.observe(img));
  </script>
</body>
</html>
