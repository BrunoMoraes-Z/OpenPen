<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing</title>
<link rel="stylesheet" href="common.css">
<style>
  .hero { padding: 96px 80px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); color: white; }
  .hero h1 { font-size: 56px; line-height: 64px; font-weight: 700; margin: 0 0 24px; max-width: 760px; letter-spacing: -1px; }
  .hero p { font-size: 20px; line-height: 30px; margin: 0 0 40px; max-width: 620px; color: rgba(255,255,255,0.85); }
  .cta { display: flex; gap: 16px; }
  .btn { display: inline-block; padding: 14px 28px; border-radius: 10px; font-weight: 600; font-size: 16px; line-height: 24px; text-decoration: none; }
  .btn-primary { background: #ffffff; color: #4f46e5; box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
  .btn-ghost { border: 2px solid rgba(255,255,255,0.7); color: #ffffff; }
  .stats { display: flex; justify-content: space-around; padding: 48px 80px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 36px; line-height: 44px; color: #111827; }
  .stat span { font-size: 14px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
  .radial { height: 220px; margin: 48px 80px; border-radius: 24px; background: radial-gradient(circle at 30% 40%, #fde68a 0%, #f59e0b 40%, #b45309 100%); }
</style>
</head>
<body>
  <section class="hero">
    <h1>Design faster with a native editor built for speed</h1>
    <p>Import any page, edit every layer, and export clean code. No sign-up, no waiting, just your designs.</p>
    <div class="cta">
      <a class="btn btn-primary" href="#start">Get started</a>
      <a class="btn btn-ghost" href="#docs">Read the docs</a>
    </div>
  </section>
  <section class="stats">
    <div class="stat"><b>120 fps</b><span>Canvas</span></div>
    <div class="stat"><b>5,000+</b><span>Nodes</span></div>
    <div class="stat"><b>$0</b><span>Price</span></div>
  </section>
  <div class="radial"></div>
</body>
</html>
