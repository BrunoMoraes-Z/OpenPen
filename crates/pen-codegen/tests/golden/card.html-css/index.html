<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="canvas" data-pen-root>
      <div class="button" data-mode="light">
        <svg class="icon" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M820 211Q815 212 811 215Q807 218 591 434L375 649L283 557Q191 465 184.5 462Q178 459 168.5 459Q159 459 152 461.5Q145 464 138.5 469.5Q132 475 129 482Q127 487 126.5 490Q126 493 126 500L126 503Q125 511 129 517Q134 525 155 546Q169 561 224 616L331 722Q351 741 359 746Q364 750 372 749L379 750Q384 750 389 748Q395 743 412 727.5Q429 712 469 673L632 510Q781 360 825 316Q869 272 871 267Q874 261 874 250Q874 243 873.5 240Q873 237 871 232Q868 226 861.5 220Q855 214 848.5 211.5Q842 209 833.5 209Q825 209 820 211Z" fill="currentColor"/>
        </svg>
        <p class="label">Save</p>
      </div>
      <div class="card" data-mode="light">
        <p class="title">Weekly report</p>
        <p class="body">Revenue grew 12% week over week &amp; churn stayed flat.</p>
        <div class="divider"></div>
        <div class="actions">
          <!-- component: Button -->
          <div class="button-2">
            <p class="label-2">Cancel</p>
          </div>
          <!-- component: Button -->
          <div class="button-3">
            <svg class="icon" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M820 211Q815 212 811 215Q807 218 591 434L375 649L283 557Q191 465 184.5 462Q178 459 168.5 459Q159 459 152 461.5Q145 464 138.5 469.5Q132 475 129 482Q127 487 126.5 490Q126 493 126 500L126 503Q125 511 129 517Q134 525 155 546Q169 561 224 616L331 722Q351 741 359 746Q364 750 372 749L379 750Q384 750 389 748Q395 743 412 727.5Q429 712 469 673L632 510Q781 360 825 316Q869 272 871 267Q874 261 874 250Q874 243 873.5 240Q873 237 871 232Q868 226 861.5 220Q855 214 848.5 211.5Q842 209 833.5 209Q825 209 820 211Z" fill="currentColor"/>
            </svg>
            <p class="label">Save</p>
          </div>
        </div>
      </div>
      <div class="card-dark" data-mode="dark">
        <p class="title">Dark mode</p>
        <!-- component: Button -->
        <div class="button-3">
          <svg class="icon" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M820 211Q815 212 811 215Q807 218 591 434L375 649L283 557Q191 465 184.5 462Q178 459 168.5 459Q159 459 152 461.5Q145 464 138.5 469.5Q132 475 129 482Q127 487 126.5 490Q126 493 126 500L126 503Q125 511 129 517Q134 525 155 546Q169 561 224 616L331 722Q351 741 359 746Q364 750 372 749L379 750Q384 750 389 748Q395 743 412 727.5Q429 712 469 673L632 510Q781 360 825 316Q869 272 871 267Q874 261 874 250Q874 243 873.5 240Q873 237 871 232Q868 226 861.5 220Q855 214 848.5 211.5Q842 209 833.5 209Q825 209 820 211Z" fill="currentColor"/>
          </svg>
          <p class="label">Save</p>
        </div>
      </div>
    </div>
  </body>
</html>
