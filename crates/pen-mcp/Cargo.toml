[package]
name = "pen-mcp"
description = "Servidor MCP do OpenPen (stdio, socket local e shim), desacoplado do motor via ToolBackend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.11.0", default-features = false, features = ["server"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "2"
futures = "0.3"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "io-util", "macros", "sync", "time"] }
tokio-util = "0.7"
interprocess = { version = "2.4.9", features = ["tokio"] }

[dev-dependencies]
rmcp = { version = "3.11.0", default-features = false, features = ["server", "client"] }

[lib]
# rustdoc is not available in this toolchain
doctest = false
