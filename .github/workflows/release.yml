# Release: builds openpen.exe + openpen-cli.exe, the per-user MSI, the portable zip and the
# MSI checksum. A pushed tag vX.Y.Z (equal to Cargo.toml [workspace.package] version)
# publishes a GitHub Release; a manual run only builds the artifacts.
# Details (pt-BR): docs/release.md
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version X.Y.Z (default: the Cargo.toml version). Nothing is published."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WIX_VERSION: "5.0.2"

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          cache-on-failure: true

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $cargo = ./scripts/version.ps1
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Fails when the tag differs from Cargo.toml.
            $v = ./scripts/version.ps1 -Expect $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION.Trim() -replace '^v', ''
            if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version input '$v' is not X.Y.Z" }
            if ($v -ne $cargo) {
              Write-Host "::warning::Artifacts are named $v but the binaries report $cargo (Cargo.toml)."
            }
          } else {
            $v = $cargo
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "cargo_version=$cargo" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v (Cargo.toml: $cargo)"

      - name: Build release binaries
        run: cargo build --release --locked -p openpen -p openpen-cli

      - name: Smoke test
        run: ./scripts/smoke-test.ps1 -BinDir target/release -Version ${{ steps.version.outputs.cargo_version }}

      - name: Install WiX ${{ env.WIX_VERSION }}
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools >> $env:GITHUB_PATH
          $env:PATH = "$tools;$env:PATH"
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix --version

      - name: Package (MSI, zip, sha256)
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }} -BinDir target/release -OutDir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenPen-${{ steps.version.outputs.version }}-x64
          path: |
            dist/OpenPen-*-x64.msi
            dist/OpenPen-*-x64.msi.sha256
            dist/OpenPen-*-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenPen-${{ needs.build.outputs.version }}-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "OpenPen-${VERSION}-x64.msi.sha256"
          cat > notes.md <<EOF
          **Windows x64.** Download \`OpenPen-${VERSION}-x64.msi\` (per-user installer, no admin rights needed)
          or the portable \`OpenPen-${VERSION}-x64-portable.zip\`. The binaries are not code-signed yet, so
          SmartScreen may warn on first run ("More info" › "Run anyway").
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OpenPen ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            "OpenPen-${VERSION}-x64.msi" \
            "OpenPen-${VERSION}-x64.msi.sha256" \
            "OpenPen-${VERSION}-x64-portable.zip"
